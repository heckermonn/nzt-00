<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B0E10">
<title>PR6</title>
<link rel="preload" href="fonts/FreeSans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body class="outside stage-full booting">
<a class="skip" href="#view">Skip to content</a>

<!-- The scene layer is a picture of the room. Everything a person needs is in the HTML above it. -->
<div id="scene" aria-hidden="true">
  <canvas id="stage"></canvas>
  <div id="still"></div>
  <canvas id="keeper"></canvas>
</div>

<header id="bar">
  <div class="bar-l">
    <button class="bar-link bar-menu" id="menu-b" type="button" aria-haspopup="dialog" hidden><i class="burger" aria-hidden="true"></i><span>Menu</span></button>
    <a class="mark" id="home" href="#/">PR6</a>
  </div>
  <nav class="bar-c" id="bar-nav" aria-label="Store" hidden>
    <button class="bar-link" id="nav-shop" type="button" aria-haspopup="dialog" data-k="shop">Shop</button>
    <a class="bar-link" href="#/dispatches" data-k="dispatches">Dispatches</a>
    <a class="bar-link" href="#/support" data-k="support">Support</a>
  </nav>
  <div class="bar-r">
    <button class="bar-link" id="snd" type="button" aria-pressed="false">Sound off</button>
    <a class="bar-link" id="bar-help" href="#/support">Help</a>
    <button class="bar-link bar-search" id="search-b" type="button" aria-haspopup="dialog" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.6"/><path d="M12.8 12.8 L17.5 17.5"/></svg><span>Search</span></button>
    <a class="bar-link" id="bar-acct" href="#/archive" data-k="account" hidden>Account</a>
    <a class="bar-link bar-bag" id="bar-order" href="#/order" hidden>Bag (<span id="bag-n">0</span>)</a>
  </div>
</header>

<!-- Controls that sit on the picture (doors, destinations, niches). Real buttons, placed over what they name. -->
<div id="marks"></div>
<!-- The sheet the pages are set on: it slides over the room when a page opens beside it. -->
<div id="paper" aria-hidden="true"></div>

<main id="view" tabindex="-1"></main>


<dialog id="index" aria-label="Menu">
  <div class="index-in">
    <div class="index-top">
      <span class="mark" aria-hidden="true">PR6</span>
      <button class="bar-link" type="button" id="index-x">Close</button>
    </div>
    <div class="index-q">
      <label class="sr" for="q">Search PR6</label>
      <input id="q" type="search" placeholder="Search products, orders, dispatches" autocomplete="off" spellcheck="false">
      <div id="q-out" aria-live="polite"></div>
    </div>
    <nav id="index-nav" aria-label="Menu"></nav>
    <div class="index-prefs">
      <button class="chip" type="button" id="snd2" aria-pressed="false">Sound off</button>
      <fieldset>
        <legend>Movement</legend>
        <label><input type="radio" name="motion" value="auto"> Follow my device</label>
        <label><input type="radio" name="motion" value="explore"> Rooms move</label>
        <label><input type="radio" name="motion" value="direct"> Still and instant</label>
      </fieldset>
      <p class="index-foot"><button class="link" type="button" id="index-out">Sign out</button> <button class="link" type="button" id="index-proto">Prototype controls</button></p>
    </div>
  </div>
</dialog>

<div id="live" class="sr" aria-live="polite"></div>

<details id="proto">
  <summary>Prototype</summary>
  <div id="proto-in"></div>
</details>

<noscript><p class="noscript">PR6 needs JavaScript to open. Nothing is tracked on this page.</p></noscript>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
