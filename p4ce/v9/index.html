<link rel="stylesheet" href="app.css">
<script>
/* before first paint: test hooks (?rm reduced motion, ?nofilm static stills, ?gate forces the gate, ?key=0047RSRV the
   NFC key, #/exit forgets this device), and who is at the door */
(function(){var q=new URLSearchParams(location.search),d=document.documentElement,m=null;
 try{m=localStorage.getItem('pr6.v9.member')}catch(e){}
 if(q.has('rm')||matchMedia('(prefers-reduced-motion: reduce)').matches)d.classList.add('rm');
 if(q.has('nofilm'))d.classList.add('nofilm');
 var exit=/^#\/exit/.test(location.hash),key=(q.get('key')||'').replace(/\s+/g,'').toUpperCase()==='0047RSRV';
 if(exit){try{localStorage.removeItem('pr6.v9.member')}catch(e){}m=null}
 d.classList.add(m==='1'&&!q.has('gate')&&!key?'in':'out');
})();
</script>

<script type="module" src="js/main.js"></script>
</head>
<body>
<!-- The gate: the only thing a guest sees. The gate module (js/gates/) writes its own markup here. -->
<section id="gate" aria-label="Closed"></section>

<!-- Members only. The home is a film (js/film.js): path-traced frames drawn into one canvas, scrubbed by scroll, swipe,
     drag or the keys, coming to rest on each of the nine stations. Over it, only quiet type. Every other page lives in
     #page, a plain scrolling surface that the film pushes into. -->
<a class="skip" href="#page">Skip to content</a>
<header id="bar" hidden></header>
<section id="film" class="film" aria-label="The film" hidden>
  <div class="film-frame" aria-hidden="true"><canvas id="filmCv"></canvas></div>
  <div class="film-veil" aria-hidden="true"></div>
  <div class="film-type" id="filmType"></div>
  <nav class="marks" id="marks" aria-label="Collections"></nav>
</section>
<main id="page" tabindex="-1" hidden></main>
<div id="fly" aria-hidden="true"></div>
<div id="scrim" hidden></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-labelledby="dwH" hidden></aside>
<div id="search" role="dialog" aria-modal="true" aria-label="Search the Formulary" hidden></div>
<div id="sheet" role="dialog" aria-modal="true" aria-label="Menu" hidden></div>
<p id="live" class="sr" aria-live="polite"></p>
</body>
