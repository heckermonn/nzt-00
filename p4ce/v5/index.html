<script>
/* before first paint: test hooks (?rm reduced motion, ?nogl no WebGL, ?gate), and who is at the door */
(function(){var q=new URLSearchParams(location.search),d=document.documentElement,m=null;
 try{m=localStorage.getItem('p4ce.v5.member')}catch(e){}
 if(q.has('rm')||matchMedia('(prefers-reduced-motion: reduce)').matches)d.classList.add('rm');
 if(q.has('nogl'))d.classList.add('nogl');
 var exit=/^#\/exit/.test(location.hash),key=(q.get('key')||'').replace(/\s+/g,'').toUpperCase()==='0047RSRV';
 d.classList.add(m==='1'&&!q.has('gate')&&!exit&&!key?'in':'out');
})();
</script>

<body>
<!-- the world (WebGL) sits at the back; every view floats over it on the same colour -->
<div id="world" aria-hidden="true"></div>

<!-- The gate: the only thing a guest sees. Each gate (js/gates/) writes its own markup into this section. -->
<section id="gate" aria-label="Closed"></section>

<!-- the members' chrome is written by js/app.js once the gate has been opened -->
<main id="views" tabindex="-1"></main>
<div id="stage" aria-hidden="true"></div>
<div id="scrim" hidden></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-labelledby="dwH" hidden></aside>
<p id="live" class="sr" aria-live="polite"></p>
</body>
