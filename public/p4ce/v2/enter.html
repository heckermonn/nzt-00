<style>
:root{
  --void:#030404; --ink:#0a0b0c; --paper:#f4f4f1;
  --text:#e9ece6; --text-dim:#8f948e; --text-ink:#0a0b0c; --text-ink-dim:#4d514e;
  --acid:#CCFF00; --line:rgba(233,236,230,.24); --line-ink:rgba(10,11,12,.28);
  --display:"Archivo","Archivo Narrow","Arial Narrow",Arial,sans-serif;
  --mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --gx:max(16px,env(safe-area-inset-left,0px)); --gxr:max(16px,env(safe-area-inset-right,0px));
  --gt:max(16px,env(safe-area-inset-top,0px)); --gb:max(16px,env(safe-area-inset-bottom,0px));
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--void);color:var(--text);overflow:hidden;overscroll-behavior:none;
  scrollbar-color:#3a3d3a var(--void);-webkit-tap-highlight-color:transparent;caret-color:var(--acid)}
body{font-family:var(--mono);font-size:12px;line-height:1.5;-webkit-font-smoothing:antialiased;position:fixed;inset:0;width:100%}
::selection{background:var(--acid);color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--acid);outline-offset:4px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}

#mark{position:fixed;left:var(--gx);top:var(--gt);z-index:20;display:flex;align-items:baseline;gap:12px;pointer-events:none}
#mark .wm{font-family:var(--display);font-weight:900;font-stretch:62%;font-variation-settings:"wdth" 62;font-size:28px;line-height:1;letter-spacing:.02em;color:var(--text);transition:color .8s}
#mark .wm b{color:var(--acid);font-weight:900}
#preview{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-dim);border:1px solid var(--line);padding:2px 6px 1px;transform:translateY(-4px);transition:color .8s,border-color .8s}
#preview[hidden]{display:none}

#skip{position:fixed;right:var(--gxr);top:var(--gt);z-index:20;display:flex;align-items:center;gap:10px;min-height:32px;padding:4px 0;
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-dim);transition:color .25s}
#skip span{border-bottom:1px solid var(--line);padding-bottom:2px;transition:border-color .25s}
#skip kbd{font:inherit;font-size:9px;letter-spacing:.12em;border:1px solid var(--line);padding:1px 5px;color:var(--text-dim)}
#skip:hover{color:var(--text)}
#skip:hover span{border-bottom-color:var(--text)}

body.white #mark .wm{color:var(--text-ink)}
body.white #mark .wm b{-webkit-text-stroke:.7px var(--ink);paint-order:stroke fill}
body.white #preview{color:var(--text-ink-dim);border-color:var(--line-ink)}
body.white #skip{color:var(--text-ink-dim)}
body.white #skip span,body.white #skip kbd{border-color:var(--line-ink)}
body.white #skip:focus-visible{outline-color:var(--ink)}

#caps{position:fixed;left:0;right:0;bottom:calc(var(--gb) + 7vh);height:20px;z-index:15;pointer-events:none}
#caps p{position:absolute;left:var(--gx);right:var(--gxr);bottom:0;margin:0;text-align:center;font-weight:500;font-size:11px;line-height:1.4;letter-spacing:.24em;text-transform:uppercase;
  color:var(--text);text-shadow:0 0 1px rgba(0,0,0,.4),0 1px 16px rgba(0,0,0,.62);opacity:0;filter:blur(6px);transform:translateY(8px);
  transition:opacity 1.1s var(--ease),filter 1.3s var(--ease),transform 1.6s var(--ease),color 1s}
#caps p.on{opacity:1;filter:blur(0);transform:none}
#caps p{isolation:isolate}
#caps p::before{content:"";position:absolute;left:50%;top:50%;width:min(620px,100%);height:72px;transform:translate(-50%,-50%);z-index:-1;pointer-events:none;
  background:radial-gradient(closest-side,rgba(0,0,0,.3),rgba(0,0,0,0));transition:background 1s}
body.white #caps p::before,body.capink #caps p::before{background:radial-gradient(closest-side,rgba(255,255,255,.42),rgba(255,255,255,0))}
#caps p .n{font-variant-numeric:tabular-nums}
body.white #caps p,body.capink #caps p{color:var(--text-ink);text-shadow:none}

#stills{position:fixed;inset:0;z-index:5;display:none;background:var(--void)}
#stills img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.1s ease}
#stills img.on{opacity:1}
body.rm #stills{display:block}
body.rm #gl{visibility:hidden}

/* no-WebGL: a captioned fade sequence */
#fb{position:fixed;inset:0;z-index:6;display:none;background:var(--void);overflow:hidden}
body.nogl #fb{display:block}
body.nogl #gl{display:none}
#fb .sc{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease}
#fb .sc.on{opacity:1}
#fb svg{position:absolute;inset:0;width:100%;height:100%}
#fb .acid{stroke:var(--acid);stroke-width:.35;stroke-dasharray:60;stroke-dashoffset:60;transition:stroke-dashoffset 2.4s cubic-bezier(.5,0,.2,1) .2s;filter:drop-shadow(0 0 1.2px rgba(204,255,0,.8))}
#fb .sc.on .acid{stroke-dashoffset:0}
#fb .room{background:
  radial-gradient(120% 70% at 50% 35%,rgba(255,255,255,0) 40%,rgba(10,12,14,.55) 100%),
  repeating-linear-gradient(90deg,#c9ced1 0 1px,#eef1f2 1px 10%,#f7f8f8 calc(10% + 0px) 12.5%),
  linear-gradient(#1a1c1e 0 6%,#dfe3e4 22%,#f1f3f3 60%,#3a3d3e 61%,#55595b 100%)}
#fb .mono-lith{position:absolute;left:50%;top:30%;width:min(18vw,120px);height:34%;transform:translateX(-50%);
  background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(225,232,236,.55));border:1px solid rgba(255,255,255,.9);
  box-shadow:0 30px 60px -20px rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#fb .mono-lith i{position:absolute;left:50%;top:14%;width:22%;height:76%;transform:translateX(-50%);border-radius:40% 40% 20% 20%/12% 12% 6% 6%;background:rgba(120,130,140,.55);filter:blur(7px)}
#fb .lockr{background:radial-gradient(60% 50% at 50% 50%,#2a2d2f,#0b0c0d 80%)}
#fb .door{position:absolute;left:50%;top:50%;width:min(30vw,190px);height:min(70vh,480px);transform:translate(-50%,-50%);
  background:linear-gradient(100deg,#9ea4a7,#d8dcdd 45%,#a9afb2);box-shadow:0 0 0 1px #2a2d2e,0 40px 80px -20px #000}
#fb .inside{position:absolute;left:50%;top:50%;width:min(30vw,190px);height:min(70vh,480px);transform:translate(-50%,-50%);background:#fbfbf8;opacity:0;
  box-shadow:0 0 90px 20px rgba(255,255,255,.55);transition:opacity 1.4s ease .9s}
#fb .sc.on .inside{opacity:1}
#fb .door{transform-origin:0 50%;transition:transform 1.8s cubic-bezier(.5,0,.15,1) .9s}
#fb .sc.on .door{transform:translate(-50%,-50%) perspective(1100px) rotateY(-64deg)}
#fb .door b{position:absolute;left:50%;top:14%;transform:translateX(-50%);font-family:var(--display);font-weight:900;font-stretch:62%;font-variation-settings:"wdth" 62;font-size:min(9vw,56px);line-height:1;color:var(--acid);text-shadow:0 0 18px rgba(204,255,0,.6)}

#fade{position:fixed;inset:0;background:var(--paper);opacity:0;pointer-events:none;z-index:12}
#bootfade{position:fixed;inset:0;background:var(--void);z-index:11;pointer-events:none;transition:opacity .9s ease}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

@media (max-width:760px){
  #mark .wm{font-size:24px}
  #skip kbd{display:none}
  #caps{bottom:calc(var(--gb) + 9vh)}
  #caps p{font-size:10px;letter-spacing:.2em}
}
@media (prefers-reduced-motion:reduce){
  #caps p{transform:none;filter:none;transition:opacity .8s ease,color .8s}
  #fb .door,#fb .acid{transition:none}
}

<script>
(function(){
  var Q=new URLSearchParams(location.search);
  var entry=null; try{ entry=sessionStorage.getItem('p4ce.v2.entry'); }catch(e){}
  if(entry!=='1') document.getElementById('preview').hidden=false;
  var NOGO=Q.has('nogo')||Q.has('t');
  var going=false;
  window.__p4go=function(fast){
    if(going) return; going=true;
    var f=document.getElementById('fade');
    var dur=fast?350:0;
    if(dur){ f.style.transition='opacity '+dur+'ms ease'; f.style.opacity='1'; document.body.classList.add('white'); }
    setTimeout(function(){ if(NOGO){ document.body.dataset.went='1'; return; } location.href='reserve.html'; }, dur+40);
  };
  document.getElementById('skip').addEventListener('click',function(){ window.__p4go(true); });
  addEventListener('keydown',function(e){ if(e.key==='Escape'){ e.preventDefault(); window.__p4go(true); } });

  /* captioned fade sequence, used when WebGL (or the module) is unavailable */
  window.__p4fallback=function(){
    if(window.__p4fbOn) return; window.__p4fbOn=1;
    document.body.classList.add('nogl');
    var bf=document.getElementById('bootfade'); bf.style.opacity='0';
    var sc=['f1','f2','f3'].map(function(i){return document.getElementById(i)});
    var cp=['c1','c2','c3'].map(function(i){return document.getElementById(i)});
    var k=-1;
    function show(i){ sc.forEach(function(s,j){s.classList.toggle('on',j===i)}); cp.forEach(function(c,j){c.classList.toggle('on',j===i)}); }
    function next(){ k++; if(k<3){ show(k); setTimeout(next, k===2?3200:2900); } else { var f=document.getElementById('fade'); f.style.transition='opacity .9s ease'; f.style.opacity='1'; document.body.classList.add('white'); setTimeout(function(){ window.__p4go(false); },950); } }
    setTimeout(next,150);
  };
  if(Q.has('nogl')){ window.__p4nogl=1; setTimeout(window.__p4fallback,50); }
  else setTimeout(function(){ if(!window.__p4boot) window.__p4fallback(); }, 6000);
})();
</script>

const key=new THREE.SpotLight(0xffffff,0,0,.22,.6,2); key.position.set(0,7,SC.z); key.target.position.set(0,1.4,SC.z); scene.add(key,key.target);
const rim=new THREE.RectAreaLight(0xeef3ff,0,.86,3); rim.position.set(0,1.6,-31.6); rim.lookAt(0,1.6,ZP); scene.add(rim);
const headLight=new THREE.PointLight(ACID,0,3.2,2); scene.add(headLight);
const rHemi=new THREE.HemisphereLight(0xeef2f6,0x2a2a28,0); scene.add(rHemi);
// Light phases. Changing which lights are visible changes shader programs, so there are exactly three
// sets, all compiled up front: E (hallway only), H (hallway + room, while the room wakes), R (room only).
const HALL_L=[...hLights,hHemi,portalLight], ROOM_L=[...rects,lockRect,sun,down,key,rim,rHemi];
let phase='';
function setPhase(ph){ if(ph===phase) return; phase=ph; HALL_L.forEach(l=>l.visible=ph!=='R'); ROOM_L.forEach(l=>l.visible=ph!=='E'); }
const phaseAt=t=>t<3.5?'E':t<6.6?'H':'R';

/* ================================================================== the acid line */
const LINE=(function(){
  const P=[]; const push=(x,y,z)=>P.push(new THREE.Vector3(x,y,z));
  const Y=.008, RR=PL.r+.3;
  push(0,Y,1.9); push(0,Y,ZP); push(0,Y,SC.z+RR);
  for(let i=1;i<=40;i++){ const a=i/40*Math.PI; push(-Math.sin(a)*RR,Y,SC.z+Math.cos(a)*RR); }
  push(0,Y,LKR_FRONT+.012);
  const S=[0]; for(let i=1;i<P.length;i++) S.push(S[i-1]+P[i].distanceTo(P[i-1]));
  const sFloorEnd=S[S.length-1], climbTop=PLATE_Y-.17, sEnd=sFloorEnd+(climbTop-Y);
  const sPortal=S[1], sRingIn=S[2], sRingOut=S[2+40];
  // core + glow ribbons along the floor (continuous strip, mitred sides)
  function strip(hw){
    const pos=[],aS=[],aW=[],idx=[]; const up=new THREE.Vector3(0,1,0), d=new THREE.Vector3(), sd=new THREE.Vector3(), t=new THREE.Vector3();
    for(let i=0;i<P.length;i++){
      d.set(0,0,0); if(i>0) d.add(t.subVectors(P[i],P[i-1]).normalize()); if(i<P.length-1) d.add(t.subVectors(P[i+1],P[i]).normalize()); d.normalize();
      sd.crossVectors(d,up).normalize();
      const a=P[i].clone().addScaledVector(sd,-hw), b=P[i].clone().addScaledVector(sd,hw);
      pos.push(a.x,a.y,a.z,b.x,b.y,b.z); aS.push(S[i],S[i]); aW.push(-1,1);
      if(i>0){ const k=i*2; idx.push(k-2,k-1,k+1,k-2,k+1,k); }
    }
    // climb up the locker door
    const k0=P.length*2, z=LKR_FRONT+.012;
    pos.push(-hw,Y,z, hw,Y,z, -hw,climbTop,z, hw,climbTop,z); aS.push(sFloorEnd,sFloorEnd,sEnd,sEnd); aW.push(-1,1,-1,1); idx.push(k0,k0+1,k0+3,k0,k0+3,k0+2);
    const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setAttribute('aS',new THREE.Float32BufferAttribute(aS,1)); g.setAttribute('aW',new THREE.Float32BufferAttribute(aW,1)); g.setIndex(idx); return g;
  }
  const U={uP:{value:-1},uT:{value:-1},uC:{value:ACID.clone()}};
  const vs=`attribute float aS,aW; varying float vS,vW; void main(){ vS=aS; vW=aW; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`;
  const core=new THREE.Mesh(strip(.018),new THREE.ShaderMaterial({uniforms:U,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-3,polygonOffsetUnits:-3,vertexShader:vs,
    fragmentShader:`uniform float uP,uT; uniform vec3 uC; varying float vS,vW; void main(){ if(vS>uP||vS<uT) discard; float h=smoothstep(1.6,0.,uP-vS); float tl=smoothstep(uT,uT+.8,vS); gl_FragColor=vec4(uC*(3.+h*3.2)*(1.-.35*vW*vW)*tl,1.); }`}));
  const glow=new THREE.Mesh(strip(.42),new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2,vertexShader:vs,
    fragmentShader:`uniform float uP,uT; uniform vec3 uC; varying float vS,vW; void main(){ if(vS>uP||vS<uT) discard; float h=smoothstep(2.,0.,uP-vS); float tl=smoothstep(uT,uT+1.2,vS); float f=exp(-vW*vW*9.)*.12+exp(-vW*vW*70.)*.24; gl_FragColor=vec4(uC*f*(1.+h*.8)*tl,1.); }`}));
  core.frustumCulled=glow.frustumCulled=false; core.renderOrder=1; glow.renderOrder=1; scene.add(core,glow);
  function at(s,out){ if(s>=sFloorEnd){ return out.set(0,Y+(s-sFloorEnd),LKR_FRONT+.06); } let i=1; while(i<S.length-1&&S[i]<s) i++; const k=clamp((s-S[i-1])/(S[i]-S[i-1]||1),0,1); return out.lerpVectors(P[i-1],P[i],k); }
  return {U,at,sPortal,sRingIn,sRingOut,sFloorEnd,sEnd};
})();

/* ================================================================== time: everything is a pure function of t */
function mono(xs,ys,endSlope){
  const n=xs.length, d=[], m=new Array(n).fill(0);
  for(let i=0;i<n-1;i++) d.push((ys[i+1]-ys[i])/(xs[i+1]-xs[i]));
  for(let i=1;i<n-1;i++){ if(d[i-1]*d[i]<=0) m[i]=0; else { const h0=xs[i]-xs[i-1], h1=xs[i+1]-xs[i], w1=2*h1+h0, w2=h1+2*h0; m[i]=(w1+w2)/(w1/d[i-1]+w2/d[i]); } }
  m[n-1]=endSlope? d[n-2]*endSlope : 0;
  return x=>{ if(x<=xs[0]) return ys[0]; if(x>=xs[n-1]) return ys[n-1]+(x-xs[n-1])*m[n-1];
    let i=0; while(x>xs[i+1]) i++; const h=xs[i+1]-xs[i], t=(x-xs[i])/h, t2=t*t, t3=t2*t;
    return (2*t3-3*t2+1)*ys[i]+(t3-2*t2+t)*h*m[i]+(-2*t3+3*t2)*ys[i+1]+(t3-t2)*h*m[i+1]; };
}
function pathTrack(keys,holdFrom0,endSlope){
  const pts=keys.map(k=>new THREE.Vector3(...k[1])), curve=new THREE.CatmullRomCurve3(pts,false,'centripetal',.5);
  curve.arcLengthDivisions=3000; const Ls=curve.getLengths(), n=pts.length;
  const ds=keys.map((k,i)=>Ls[Math.round(i/(n-1)*3000)]), ts=keys.map(k=>k[0]);
  if(holdFrom0){ ts.unshift(0); ds.unshift(0); }
  const D=mono(ts,ds,endSlope), total=Ls[3000];
  return (t,out)=>out.copy(curve.getPointAt(clamp(D(t)/total,0,1)));
}
const T_END=13.5;
function buildKeys(){
  const P=portrait();
  const X=P?.72:1, R=5.5, orb=a=>[R*Math.sin(a*Math.PI/180),1.3,SC.z+R*Math.cos(a*Math.PI/180)];
  const cam=[
    [0.9,[0,1.62,2.7]],[2.5,[0,1.62,-5]],[3.8,[.05,1.64,-13.5]],[5.0,[.3*X,1.72,-20.4]],
    [6.4,[.7*X,1.5,-22.8]],
    [7.6,orb(10)],[8.3,orb(17.5)],[9.0,orb(25)],            // hero beat: slow, centred orbit round the monolith
    [10.6,[(P?1.3:1.6),1.5,-33.8]],[11.6,[.3,1.55,-38.2]],[12.6,[0,1.52,RZ1+3.2]],[T_END,[0,1.42,RZ1+.3]]];
  const look=[
    [0.9,[0,1.45,-12]],[3.0,[0,1.55,-22]],[4.6,[0,2.6,-30]],[6.2,[-.6,3.0,-30.5]],[7.7,[0,1.9,SC.z]],[8.4,[0,1.8,SC.z]],
    [9.0,[0,1.4,-34]],[9.6,[0,1.3,RZ1]],[11.2,[0,1.38,RZ1]],[T_END,[0,1.4,RZ1-1]]];
  const fovT=[0,4.6,6.3,7.6,9.0,9.9,11.4,12.5,T_END], fovV=P?[60,60,66,52,52,58,58,56,46]:[40,40,48,34,34,40,40,39,32];
  const rollT=[0,5,6.4,7.6,9.0,10.0,11.2,T_END], rollV=[0,0,-.01,0,0,.012,0,0];
  return {pos:pathTrack(cam,true,.5), look:pathTrack(look,true,.3), fov:mono(fovT,fovV), roll:mono(rollT,rollV)};
}
let KEYS=buildKeys();
const lineHead=mono([.6,3.4,5.0,6.4,8.6,9.2],[0,LINE.sPortal,LINE.sRingIn,LINE.sRingOut,LINE.sFloorEnd,LINE.sEnd]);
const lineTail=mono([9.7,10.9],[0,LINE.sEnd+.1]);
function tOfS(s){ let a=.6,b=9.2; for(let i=0;i<30;i++){ const m=(a+b)/2; if(lineHead(m)<s) a=m; else b=m; } return (a+b)/2; }
tubes.forEach((tb,k)=>tb.t0=Math.max(tOfS(1.9-tb.z)-1.0,.7+k*.14));   // each tube strikes as the line approaches it
const PAT=[[0,1],[.05,0],[.13,.5],[.19,0],[.33,1],[.4,.1],[.47,1],[.55,.6],[.6,1]];
function tubeV(t,t0){ let v=0; for(const [dt,val] of PAT){ if(t>=t0+dt) v=val; else break; } return v; }

const CAPS=[['#c1',.4,3.1],['#c2',5.8,9.1],['#c3',11.2,99]];
const _p=new THREE.Vector3(), _l=new THREE.Vector3();
let lastCaps='';
function apply(t){
  // camera
  KEYS.pos(t,_p); KEYS.look(t,_l);
  const br=Math.sin(t*.9)*.006+Math.sin(t*2.3+1.)*.002;
  cam.position.set(_p.x+Math.sin(t*.7)*.01,_p.y+br,_p.z);
  cam.lookAt(_l); cam.rotateZ(KEYS.roll(t));
  const f=KEYS.fov(t); if(Math.abs(cam.fov-f)>.001){ cam.fov=f; cam.updateProjectionMatrix(); }
  const px=renderer.getDrawingBufferSize(_v2).y/(2*Math.tan(cam.fov*Math.PI/360));
  fig.U.uPx.value=px; dust.U.uPx.value=px;

  // acid line
  const head=t<.6?-1:lineHead(t), tail=t<9.7?-1:lineTail(t);
  LINE.U.uP.value=head; LINE.U.uT.value=tail;
  const live=head>0&&tail<LINE.sEnd;
  if(live){ LINE.at(Math.max(head-.1,0),headLight.position); headLight.position.y+=.18; headLight.intensity=.7*(1-sm(9.0,9.6,t)); } else headLight.intensity=0;

  // hallway tubes strike as the line passes beneath them
  let mean=0, flash=0;
  for(const tb of tubes){ tb.v=tubeV(t,tb.t0); tb.mat.color.setRGB(tb.v*5.2,tb.v*5.4,tb.v*5.9); mean+=tb.v; if(t>tb.t0) flash+=.07*Math.exp(-(t-tb.t0)/.22); }
  mean/=tubes.length;
  hLights.forEach((l,k)=>{ let a=0,n=0; for(const tb of tubes){ if(Math.abs(tb.z-l.position.z)<3.6){ a+=tb.v; n++; } } l.intensity=(n?a/n:0)*10; });
  for(const [m,lo,hi] of HALL_MATS) m.envMapIntensity=lo+(hi-lo)*mean;
  hHemi.intensity=.04+.05*mean;

  // the room powers on: panels wake in a wave from the threshold outward
  const R=sm(3.7,6.8,t);
  panelU.uT.value=t; panelU.uWin.value=sm(4.0,6.0,t);
  portalLight.intensity=R*7;
  rects.forEach((l,i)=>l.intensity=R*(i<2?.6:.4));
  for(const [m,k] of ROOM_MATS) m.envMapIntensity=k*R*.45;
  glass.envMapIntensity=.7*R;
  rHemi.intensity=R*.08;
  const K=sm(4.0,5.6,t); key.intensity=K*45; rim.intensity=K*6; floor.material.uniforms.uKey.value=K;
  const S=sm(4.2,6.4,t);
  shaftU.uOn.value=S; shaftU.uT.value=t; sun.intensity=S*5.5; dust.U.uOn.value=S; dust.U.uT.value=t;
  down.intensity=sm(7.5,9.5,t)*60;
  // the figure is scanned into being, then begins to lift away
  fig.U.uOn.value=sm(4.8,5.4,t); fig.U.uScan.value=lerp(.1,2.3,sm(5.0,7.0,t))+(t>7?(t-7)*.5:0); fig.U.uT.value=t; fig.U.uRel.value=sm(6.6,8.4,t);
  frostU.uOn.value=sm(4.1,6.4,t);

  // locker 0047: lit by the line, unlatches, opens onto white light
  const plate=sm(9.15,9.3,t)*(1+.9*Math.exp(-Math.max(t-9.25,0)/.35));
  plateM.color.setRGB(.05+ACID.r*3.4*plate,.055+ACID.g*3.4*plate,.055+ACID.b*3.4*plate);
  const unl=sm(10.85,10.95,t)*.05, op=sm(11.1,12.15,t);
  door.rotation.y=-(unl+op*1.9+Math.sin(op*Math.PI)*.08);
  const Lk=sm(10.9,12.0,t)*.75+sm(12.5,13.4,t)*1.8;
  leak.material.opacity=sm(10.86,11.0,t)*(1-sm(11.25,11.75,t));
  innerU.uL.value=Lk*2.1;
  lockRect.intensity=Lk*3.2; floor.material.uniforms.uLock.value=Lk*sm(11.0,11.8,t);
  halo.material.opacity=sm(12.6,13.4,t)*.55; halo.visible=t>12.6;
  monolith.visible=t>4.0;

  // grade and exposure (restrained; only the final beat goes white)
  renderer.toneMappingExposure=(1+flash)*(1-.06*R)*(1+.35*sm(12.7,13.4,t));
  bloom.strength=.62; bloom.threshold=2.4;

  // performance: never draw the world behind the camera
  hall.visible=_p.z>-27; room.visible=t>2.6||_p.z<-12; floor.visible=room.visible&&R>.001;
  setPhase(phaseAt(t));

  // captions and the final fade
  const on=CAPS.filter(c=>t>=c[1]&&t<c[2]).map(c=>c[0]).join();
  if(on!==lastCaps){ lastCaps=on; CAPS.forEach(c=>$(c[0]).classList.toggle('on',on.includes(c[0]))); }
  const fw=sm(12.6,13.4,t); $('#fade').style.opacity=fw.toFixed(3); document.body.classList.toggle('white',fw>.55); document.body.classList.toggle('capink',t>=11.9);
}
const _v2=new THREE.Vector2();

/* ================================================================== post */
const rtSamples=SOFT?(HQ?4:0):(portrait()?2:4);
const composer=new EffectComposer(renderer,new THREE.WebGLRenderTarget(innerWidth*DPR,innerHeight*DPR,{type:THREE.HalfFloatType,samples:rtSamples}));
composer.setPixelRatio(DPR); composer.setSize(innerWidth,innerHeight);
composer.addPass(new RenderPass(scene,cam));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.62,.5,2.4); composer.addPass(bloom);
composer.addPass(new OutputPass());
const grade=new ShaderPass({uniforms:{tDiffuse:{value:null},uT:{value:0},uV:{value:portrait()?.55:.75}},
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader:`uniform sampler2D tDiffuse; uniform float uT,uV; varying vec2 vUv;
  void main(){ vec4 c=texture2D(tDiffuse,vUv); vec2 q=vUv-.5; c.rgb*=1.-dot(q,q)*uV;
    float g=fract(sin(dot(vUv*vec2(1231.7,787.3)+fract(uT)*91.,vec2(12.9898,78.233)))*43758.5453); c.rgb+=(g-.5)*.022; gl_FragColor=c; }`});
composer.addPass(grade);

let degraded=false; const ft=[];
function degrade(){
  degraded=true;
  if(DPR>1){ DPR=1; renderer.setPixelRatio(1); composer.setPixelRatio(1); renderer.setSize(innerWidth,innerHeight,false); composer.setSize(innerWidth,innerHeight); }
  for(const rt of [composer.renderTarget1,composer.renderTarget2]){ if(rt.samples){ rt.samples=0; rt.dispose(); } }
  dust.g.setDrawRange(0,Math.floor(dust.g.attributes.position.count/2));
}
function render(t){ apply(t); if(!render.sh){ renderer.shadowMap.needsUpdate=true; render.sh=1; } grade.uniforms.uT.value=t; composer.render(); }
addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight,false); composer.setSize(innerWidth,innerHeight);
  cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix(); KEYS=buildKeys();
  grade.uniforms.uV.value=portrait()?.55:.75;
  floor.getRenderTarget().setSize(Math.round(innerWidth*DPR*.5),Math.round(innerHeight*DPR*.5));
  if(!playing) render(T);
});

/* ================================================================== run */
let T=0, playing=true, last=performance.now(), done=false;
const START=Q.has('t')?parseFloat(Q.get('t'))||0:null;
function finish(){ if(done) return; done=true; window.__p4go(false); }
function frame(now){
  requestAnimationFrame(frame);
  if(document.hidden){ last=now; return; }
  if(SOFT&&now-last<200) return;   // software GL: fewer, larger steps so the sequence keeps real time
  const raw=(now-last)/1000, dt=Math.min(raw,SOFT?.6:.05); last=now;
  if(!playing) return;
  if(!SOFT&&!degraded){ ft.push(raw); if(ft.length>30){ ft.shift(); if(ft.reduce((a,b)=>a+b,0)/30>.022) degrade(); } }
  T+=dt; if(T>=T_END+.1){ T=T_END+.1; render(T); playing=false; finish(); return; }
  render(T);
}
document.addEventListener('visibilitychange',()=>{ last=performance.now(); });
const fontsDone=Promise.race([Promise.all([document.fonts.load('900 100px "Archivo"'),document.fonts.load('500 20px "JetBrains Mono"')]),new Promise(r=>setTimeout(r,1800))]);

function reveal(){ const b=$('#bootfade'); b.style.opacity='0'; }
async function reducedMotion(){
  document.body.classList.add('rm');
  await fontsDone; redraw.forEach(f=>f());
  const shots=[3.3,8.4,12.15].map(t=>{ render(t); return renderer.domElement.toDataURL('image/jpeg',.9); });
  const imgs=['#s1','#s2','#s3'].map(s=>$(s)); imgs.forEach((im,i)=>im.src=shots[i]);
  $('#fade').style.opacity='0'; document.body.classList.remove('white'); reveal();
  const caps=['#c1','#c2','#c3'];
  const show=i=>{ imgs.forEach((im,j)=>im.classList.toggle('on',j===i)); caps.forEach((c,j)=>$(c).classList.toggle('on',j===i)); };
  [0,1,2].forEach(i=>setTimeout(()=>show(i),150+i*2700));
  setTimeout(()=>{ const f=$('#fade'); f.style.transition='opacity .9s ease'; f.style.opacity='1'; document.body.classList.add('white'); setTimeout(()=>window.__p4go(false),950); },150+3*2700);
}

window.__enter={
  seek(t){ playing=false; T=t; render(t); return t; },
  play(t){ if(t!=null) T=t; playing=true; last=performance.now(); },
  pause(){ playing=false; },
  get t(){ return T; }, T_END, SOFT, get DPR(){ return DPR; }, get degraded(){ return degraded; }, degrade,
  info(){ return {t:T,playing,fov:cam.fov,cam:cam.position.toArray().map(v=>+v.toFixed(2)),calls:renderer.info.render.calls,tris:renderer.info.render.triangles}; }
};

// compile every program for every light phase before the first frame, so nothing compiles mid-flight
async function precompile(){
  const keep=[hall.visible,room.visible,monolith.visible,halo.visible,floor.visible];
  hall.visible=room.visible=monolith.visible=halo.visible=floor.visible=true;
  for(const ph of ['R','H','E']){ setPhase(ph); try{ await renderer.compileAsync(scene,cam); }catch(e){ break; } }
  [hall.visible,room.visible,monolith.visible,halo.visible,floor.visible]=keep;
}
(async()=>{
  if(RM){ reducedMotion(); return; }                       // three stills: compile only what they use
  await Promise.race([precompile(),new Promise(r=>setTimeout(r,SOFT?9000:3500))]);
  if(START!=null){ playing=false; T=START; }
  render(START??0);
  fontsDone.then(()=>{ redraw.forEach(f=>f()); if(START!=null) render(T); });
  requestAnimationFrame(()=>reveal());
  last=performance.now(); requestAnimationFrame(frame);
})();
</script>
