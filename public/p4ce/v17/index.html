<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Closed</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#171c1f">
<link rel="preload" href="fonts/FreeSans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/FreeSansBold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
<script>
/* before first paint: test hooks (?rm reduced motion, ?gate forces the gate, ?key=0047RSRV the NFC key, #/exit forgets
   this device, ?nogl the poster path), and who is at the door */
(function(){var q=new URLSearchParams(location.search),d=document.documentElement,m=null;
 try{m=localStorage.getItem('pr6.v17.member')}catch(e){}
 if(q.has('rm')||matchMedia('(prefers-reduced-motion: reduce)').matches)d.classList.add('rm');
 var exit=/^#\/exit/.test(location.hash),key=(q.get('key')||'').replace(/\s+/g,'').toUpperCase()==='0047RSRV';
 if(exit){try{localStorage.removeItem('pr6.v17.member')}catch(e){}m=null}
 d.classList.add(m==='1'&&!q.has('gate')&&!key?'in':'out');
})();
</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module" src="js/main.js"></script>
</head>
<body>
<!-- The gate: the only thing a guest sees, in the night register. The gate module (js/gates/) writes its own markup here. -->
<section id="gate" aria-label="Closed"></section>

<!-- Members only. Every page lives in #page, one scrolling surface. The chrome: on a desktop a thin bar; on a phone a
     top line (where you are, and Back) and a thumb bar. -->
<a class="skip" href="#page">Skip to content</a>
<!-- v17: the living medium (js/cells.js). One canvas: under the landing's type (the nine Series cells), and behind
     every page, pale. -->
<canvas id="medium" aria-hidden="true"></canvas>
<header id="bar" hidden></header>
<div id="top" hidden></div>
<!-- The first screen after the gate: the Atlas film (js/film.js), path-traced frames drawn into one canvas, scrubbed by
     scroll, swipe, drag or the keys. Every other page lives in #page, over it. -->
<section id="film" class="film" aria-label="PR6: the Atlas, nine series" hidden>
  <div class="film-frame" aria-hidden="true"><canvas id="filmCv"></canvas></div>
  <div class="film-veil" aria-hidden="true"></div>
  <div class="film-type" id="filmType"></div>
  <nav class="marks" id="marks" aria-label="Series"></nav>
</section>
<!-- the landing, keynote slide 1 alive: the type, the nine Series (each a cell of the medium) and the slide 2 rules -->
<div class="h0" id="h0" hidden>
  <div class="h0-grain" aria-hidden="true"></div>
  <div class="h0-t"><h1 class="h0-wm" tabindex="-1">PR6</h1><p class="h0-tag mono">THE PRACTICE OF PROGRESS</p></div>
  <nav class="h0-nine" id="h0Nine" aria-label="Series"></nav>
  <div class="h0-rule h0-rt mono" aria-hidden="true"><span>PR6 / SERIES 01&ndash;09</span><span data-h0-clock>T+00:00:00</span></div>
  <div class="h0-rule h0-rb mono" aria-hidden="true"><span data-h0-count></span><span class="h0-ticks"><i>01</i><i>02</i><i>03</i><i>04</i><i>05</i><i class="o">06</i></span></div>
  <button class="h0-go" type="button" data-h0-go><span class="mono">ENTER</span><i aria-hidden="true"></i></button>
</div>
<main id="page" tabindex="-1" hidden></main>
<!-- slide 2's hairline index, as the reading position of the page -->
<div id="ruler" aria-hidden="true" hidden><i>01</i><i>02</i><i>03</i><i>04</i><i>05</i><i class="o">06</i><b></b></div>
<canvas id="mito" aria-hidden="true" hidden></canvas>
<nav id="thumb" aria-label="Main" hidden></nav>
<div id="fly" aria-hidden="true"></div>
<div id="scrim" hidden></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-labelledby="dwH" hidden></aside>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="shH" hidden></div>
<p id="live" class="sr" aria-live="polite"></p>
</body>
</html>
